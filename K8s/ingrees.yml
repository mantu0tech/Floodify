apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickncart-ingress
  namespace: floodify
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing       # public subnets
    alb.ingress.kubernetes.io/target-type: ip    
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:

      # FRONTEND
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

      # BACKEND API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080